name: 自治体障害情報 日次モニター

on:
  schedule:
    # 毎時実行（障害は時間が命のため）。新規が出た時だけメール通知する。
    # GitHubのスケジュールは数分遅延することがある。
    - cron: "0 * * * *"
  workflow_dispatch: {}   # 手動実行も可

permissions:
  contents: write   # keepaliveコミット（自動無効化の防止）に必要

concurrency:
  group: jichitai-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存インストール
        run: pip install -r requirements.txt

      # 差分状態(seen.json)を日次キャッシュで永続化（毎日アクセスされるので消えない）
      - name: 状態キャッシュ復元/保存
        uses: actions/cache@v4
        with:
          path: state/seen.json
          key: seen-${{ github.run_id }}
          restore-keys: |
            seen-

      - name: 巡回・差分・メール送信
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          NOTIFY_EMPTY: "false"   # 新規なしの時はメールを送らない
        run: python3 main.py

      # GitHubは60日間コミットが無いとスケジュールを自動停止する(disabled_inactivity)。
      # 25日以上コミットが無ければ打刻コミットを入れ、停止を確実に防ぐ。
      - name: keepalive（スケジュール自動停止の防止）
        if: github.event_name == 'schedule'
        continue-on-error: true   # 失敗しても本体の監視は成功扱いにする
        run: |
          LAST=$(git log -1 --format=%ct)
          DAYS=$(( ( $(date +%s) - LAST ) / 86400 ))
          echo "最終コミットから ${DAYS} 日経過"
          if [ "$DAYS" -ge 25 ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .keepalive
            git commit -m "chore: keepalive（スケジュール自動停止の防止）"
            git push
            echo "keepaliveコミットを実行しました"
          else
            echo "まだ猶予があるため何もしません"
          fi
